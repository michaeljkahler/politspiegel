<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" font-family="Arial, 'Helvetica Neue', system-ui, sans-serif">
<rect x="0.0" y="0.0" width="1120.0" height="830.0" fill="#f7f8fa" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<rect x="0.0" y="0.0" width="1120.0" height="8.0" fill="#3c4652" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<text x="70.0" y="54.0" font-size="30" fill="#12161c" text-anchor="start" font-weight="bold">Tempo 30 und die Blaulichtorganisationen</text>
<text x="70.0" y="86.0" font-size="16" fill="#5a626d" text-anchor="start" font-weight="normal">Wie viel länger wäre eine Einsatzfahrt, wenn innerorts überall Tempo 30 gälte? Die rechnerische Antwort und die entscheidende Einordnung.</text>
<rect x="70.0" y="118.0" width="980.0" height="320.0" fill="#ffffff" rx="14" stroke="#e2e6eb" stroke-width="1.5" opacity="1"/>
<text x="94.0" y="152.0" font-size="18" fill="#12161c" text-anchor="start" font-weight="bold">Rechnerische Mehrzeit einer Einsatzfahrt</text>
<text x="94.0" y="176.0" font-size="13" fill="#5a626d" text-anchor="start" font-weight="normal">Richtwert +30 Sekunden je Kilometer (Polizei Freiburg, ideale Bedingungen), je Länge der auf Tempo 30 gefahrenen Strecke.</text>
<text x="94.0" y="196.0" font-size="12.5" fill="#6e7783" text-anchor="start" font-weight="normal">Gilt nur, falls das Fahrzeug tatsächlich langsamer fährt. Rechtlich ist das nicht zwingend (siehe unten).</text>
<line x1="320.0" y1="222.0" x2="320.0" y2="418.0" stroke="#e2e6eb" stroke-width="1"/>
<text x="320.0" y="434.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">0</text>
<line x1="421.7" y1="222.0" x2="421.7" y2="418.0" stroke="#e2e6eb" stroke-width="1"/>
<text x="421.7" y="434.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">0.5</text>
<line x1="523.3" y1="222.0" x2="523.3" y2="418.0" stroke="#e2e6eb" stroke-width="1"/>
<text x="523.3" y="434.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">1</text>
<line x1="625.0" y1="222.0" x2="625.0" y2="418.0" stroke="#e2e6eb" stroke-width="1"/>
<text x="625.0" y="434.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">1.5</text>
<line x1="726.7" y1="222.0" x2="726.7" y2="418.0" stroke="#e2e6eb" stroke-width="1"/>
<text x="726.7" y="434.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">2</text>
<line x1="828.3" y1="222.0" x2="828.3" y2="418.0" stroke="#e2e6eb" stroke-width="1"/>
<text x="828.3" y="434.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">2.5</text>
<line x1="930.0" y1="222.0" x2="930.0" y2="418.0" stroke="#e2e6eb" stroke-width="1"/>
<text x="930.0" y="434.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">3</text>
<text x="625.0" y="452.0" font-size="12" fill="#8b93a1" text-anchor="middle" font-weight="normal">zusätzliche Fahrzeit (Minuten)</text>
<text x="94.0" y="249.0" font-size="14" fill="#12161c" text-anchor="start" font-weight="bold">1 km Tempo-30-Strecke</text>
<rect x="320.0" y="233.0" width="101.7" height="22.0" fill="#3c4652" rx="4" stroke="none" stroke-width="1" opacity="1"/>
<text x="431.7" y="249.0" font-size="13" fill="#12161c" text-anchor="start" font-weight="bold">+0.5 Min</text>
<text x="94.0" y="293.0" font-size="14" fill="#12161c" text-anchor="start" font-weight="bold">2 km Tempo-30-Strecke</text>
<rect x="320.0" y="277.0" width="203.3" height="22.0" fill="#3c4652" rx="4" stroke="none" stroke-width="1" opacity="1"/>
<text x="533.3" y="293.0" font-size="13" fill="#12161c" text-anchor="start" font-weight="bold">+1.0 Min</text>
<text x="94.0" y="337.0" font-size="14" fill="#12161c" text-anchor="start" font-weight="bold">3 km Tempo-30-Strecke</text>
<rect x="320.0" y="321.0" width="305.0" height="22.0" fill="#3c4652" rx="4" stroke="none" stroke-width="1" opacity="1"/>
<text x="635.0" y="337.0" font-size="13" fill="#12161c" text-anchor="start" font-weight="bold">+1.5 Min</text>
<text x="94.0" y="381.0" font-size="14" fill="#12161c" text-anchor="start" font-weight="bold">5 km Tempo-30-Strecke</text>
<rect x="320.0" y="365.0" width="508.3" height="22.0" fill="#3c4652" rx="4" stroke="none" stroke-width="1" opacity="1"/>
<text x="838.3" y="381.0" font-size="13" fill="#12161c" text-anchor="start" font-weight="bold">+2.5 Min</text>
<text x="70.0" y="474.0" font-size="20" fill="#12161c" text-anchor="start" font-weight="bold">Drei Fakten zur Einordnung</text>
<rect x="70.0" y="494.0" width="310.7" height="250.0" fill="#ffffff" rx="12" stroke="#e2e6eb" stroke-width="1.3" opacity="1"/>
<rect x="70.0" y="494.0" width="310.7" height="6.0" fill="#3c4652" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="104.0" cy="538.0" r="16" fill="#3c4652"/>
<text x="104.0" y="544.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="92.0" y="586.0" font-size="15.5" fill="#12161c" text-anchor="start" font-weight="bold">Rechtlich nicht gebunden</text>
<text x="92.0" y="612.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Einsatzfahrzeuge mit Blaulicht und</text>
<text x="92.0" y="630.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Wechselklanghorn dürfen die signalisierte</text>
<text x="92.0" y="648.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Höchstgeschwindigkeit überschreiten (Art.</text>
<text x="92.0" y="666.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">100 Ziff. 4 SVG, mit gebotener Sorgfalt).</text>
<text x="92.0" y="684.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Eine reine Signalisation Tempo 30</text>
<text x="92.0" y="702.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">verlängert die Einsatzfahrt daher nicht</text>
<text x="92.0" y="720.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">zwingend.</text>
<rect x="404.7" y="494.0" width="310.7" height="250.0" fill="#ffffff" rx="12" stroke="#e2e6eb" stroke-width="1.3" opacity="1"/>
<rect x="404.7" y="494.0" width="310.7" height="6.0" fill="#3c4652" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="438.7" cy="538.0" r="16" fill="#3c4652"/>
<text x="438.7" y="544.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="426.7" y="586.0" font-size="15.5" fill="#12161c" text-anchor="start" font-weight="bold">Der Verkehr entscheidet</text>
<text x="426.7" y="612.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Für die Einsatzzeit ist die Verkehrsdichte</text>
<text x="426.7" y="630.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">wichtiger als das Tempolimit. Dichter</text>
<text x="426.7" y="648.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Verkehr verzögert Einsätze weit stärker</text>
<text x="426.7" y="666.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">als 30 statt 50. Studie Luzern: unter 1</text>
<text x="426.7" y="684.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Minute Verzögerung gilt als vertretbar.</text>
<rect x="739.3" y="494.0" width="310.7" height="250.0" fill="#ffffff" rx="12" stroke="#e2e6eb" stroke-width="1.3" opacity="1"/>
<rect x="739.3" y="494.0" width="310.7" height="6.0" fill="#3c4652" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="773.3" cy="538.0" r="16" fill="#3c4652"/>
<text x="773.3" y="544.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="761.3" y="586.0" font-size="15.5" fill="#12161c" text-anchor="start" font-weight="bold">Bauliche Massnahmen bremsen alle</text>
<text x="761.3" y="612.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Schwellen und Vertikalversätze verzögern</text>
<text x="761.3" y="630.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">auch Einsatzfahrzeuge, weil diese nicht</text>
<text x="761.3" y="648.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">umfahrbar sind. Genau solche baulichen</text>
<text x="761.3" y="666.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Massnahmen will die Initiative verhindern;</text>
<text x="761.3" y="684.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">hier liegt der eigentliche Nutzen für die</text>
<text x="761.3" y="702.0" font-size="12.3" fill="#5a626d" text-anchor="start" font-weight="normal">Blaulichtorganisationen.</text>
<text x="70.0" y="790.0" font-size="11" fill="#8b93a1" text-anchor="start" font-weight="normal">Quellen: ASTRA, Merkblatt Blaulicht/Wechselklanghorn (Art. 100 Ziff. 4 SVG, Art. 26 SVG); Beobachter und Polizei Freiburg (+30 s/km); Studie Luzern.</text>
<text x="70.0" y="808.0" font-size="11" fill="#8b93a1" text-anchor="start" font-weight="normal">Rechnerische Richtwerte, keine Einsatzstatistik.</text>
</svg>