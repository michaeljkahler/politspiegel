<text x="70.0" y="872.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">•  Die Regionallinien 21, 24 und 25 sammeln die meiste Zusatzzeit, weil sie viele enge Ortsdurchfahrten aneinanderreihen; dort wirkt Tempo 30 voll.</text>
<text x="70.0" y="898.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">•  In dicht getakteten Stadtabschnitten (kurze Haltestellenabstände) erreichen Busse zwischen den Halten selten 50 km/h. Dort ist die reale Wirkung kleiner als hier gerechnet.</text>
<text x="70.0" y="924.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">•  Der öV-Fahrplan ist damit ein gewichtiges Argument der Initiative. Er ist gegen den Sicherheits- und Lärmnutzen an konkreten Problemstellen abzuwägen (gezielt statt flächendeckend).</text>
<text x="50.0" y="996.0" font-size="11.5" fill="#8b93a1" text-anchor="start" font-weight="normal">Quellen: OpenStreetMap (Linienführung); ASTRA-Forschungsbericht 1663 (+20 s/km). Werte illustrativ, ohne konkrete Fahrplanreserven.</text>
