<text x="40" y="52" font-size="27" font-weight="700" fill="#12161c" font-family="Archivo, Helvetica, Arial, sans-serif">Wie schnell sind die Schaffhauser Busse wirklich?</text>
<text x="40" y="80" font-size="15" fill="#5a626d">Dunkel die Reisegeschwindigkeit samt Haltezeit, hell die reine Fahrgeschwindigkeit ohne Halte.</text>
<text x="40" y="101" font-size="13" fill="#5a626d">Fahrplan vom 8. September 2026, Haltestellen des Bundesamts für Verkehr, Weglänge entlang der Strassenachsen aus OpenStreetMap.</text>
