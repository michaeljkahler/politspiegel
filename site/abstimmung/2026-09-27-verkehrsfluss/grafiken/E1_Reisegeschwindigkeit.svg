<text x="60" y="663" font-size="14" font-weight="700" fill="#12161c" font-family="Archivo, Helvetica, Arial, sans-serif">Einordnung</text>
<text x="60" y="684" font-size="13" fill="#5a626d">Alle sieben Stadtlinien in beiden Richtungen. Samt Haltezeit erreicht kein Kurs 30 km/h:</text>
<text x="60" y="702" font-size="13" fill="#5a626d">15,9 bis 24,1, im Mittel 19,6.</text>
<text x="60" y="720" font-size="13" fill="#5a626d">Ohne Haltezeit, mit 12 Sekunden je Halt, liegen 12 der 14 Kurse weiterhin unter 30.</text>
<text x="60" y="738" font-size="13" fill="#5a626d">Nur die Auswärtsrichtungen der Linien 5 und 7 kommen mit 31,3 und 30,3 knapp darüber.</text>
<text x="60" y="756" font-size="13" fill="#5a626d">Bei Haltestellen alle 369 Meter sind ohnehin höchstens rund 34 km/h möglich,</text>
<text x="60" y="774" font-size="13" fill="#5a626d">weil Beschleunigen und Bremsen den Abschnitt aufbrauchen. Tempo 30 kostet also etwas,</text>
<text x="60" y="792" font-size="13" fill="#5a626d">aber nur auf wenigen Abschnitten und viel weniger, als die Spanne 50 zu 30 nahelegt.</text>
<text x="40" y="830" font-size="11" fill="#5a626d">Quellen: transport.opendata.ch, ch.bav.haltestellen-oev, OpenStreetMap. Fahrdynamik 1,0 und 1,2 m/s². Haltezeit 12 s je Halt, aus den Daten hergeleitet: höhere Werte</text>
<text x="40" y="845" font-size="11" fill="#5a626d">ergäben für die schnellsten Kurse eine physikalisch unmögliche Fahrgeschwindigkeit. Von 246 Abschnitten liessen sich 79 nicht über das Netz führen, dort Luftlinie mal 1,2. Eigene Auswertung, ohne Gewähr.</text>
</svg>