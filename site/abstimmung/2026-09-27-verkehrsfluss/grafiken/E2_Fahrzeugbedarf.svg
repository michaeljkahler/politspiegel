<line x1="414.3" y1="404" x2="414.3" y2="432" stroke="#12161c" stroke-width="3"/>
<text x="672.6" y="416" font-size="12" fill="#12161c">14 vorhanden, 1,1 gebraucht, 12,9 bleiben</text>
<text x="672.6" y="431" font-size="12" fill="#5a626d" font-weight="400">reicht aus</text>
<rect x="40" y="472" width="920" height="184" rx="10" fill="none" stroke="#e2e6eb"/>
<text x="60" y="497" font-size="14" font-weight="700" fill="#12161c" font-family="Archivo, Helvetica, Arial, sans-serif">Einordnung</text>
<text x="60" y="518" font-size="13" fill="#5a626d">Der Fahrzeugbedarf ist eine Treppenfunktion: Solange die Zusatzzeit in die Wendezeit</text>
<text x="60" y="536" font-size="13" fill="#5a626d">passt, kostet sie nichts. Reicht die Wendezeit nicht mehr, braucht es ein ganzes</text>
<text x="60" y="554" font-size="13" fill="#5a626d">Fahrzeug samt Personal.</text>
<text x="60" y="572" font-size="13" fill="#5a626d">Nach dem physikalischen Modell braucht keine Linie ein zusätzliches Fahrzeug, weil vier</text>
<text x="60" y="590" font-size="13" fill="#5a626d">der sechs schon heute langsamer fahren, als Tempo 30 zuliesse. Nach dem ASTRA-Richtwert</text>
<text x="60" y="608" font-size="13" fill="#5a626d">kippt Linie 1: ihre 5 Minuten Reserve reichen nach Abzug von 3,4 nicht mehr für die</text>
<text x="60" y="626" font-size="13" fill="#5a626d">2 Minuten, die in Neuhausen Herbstäcker planmässig gewendet werden.</text>
<text x="60" y="644" font-size="13" fill="#5a626d">Die ehrliche Antwort lautet damit: null bis ein zusätzliches Fahrzeug.</text>
<text x="40" y="696" font-size="11" fill="#5a626d">Quellen: Fahrplan transport.opendata.ch, Kurse vom 08.09.2026. Zusatzzeit physikalisch aus Haltestellenabstand und Fahrdynamik,</text>
<text x="40" y="711" font-size="11" fill="#5a626d">oder nach ASTRA-Forschungsbericht 1663 mit 20 s je km. Nicht dargestellt: Linie 8 (Taktprobe nicht bestanden) und die Regionallinien 21 bis 25</text>
<text x="40" y="726" font-size="11" fill="#5a626d">mit mehreren Ästen. Eigene Auswertung, ohne Gewähr.</text>
</svg>