<text x="40" y="52" font-size="27" font-weight="700" fill="#12161c" font-family="Archivo, Helvetica, Arial, sans-serif">Braucht Tempo 30 einen zusätzlichen Bus?</text>
<text x="40" y="80" font-size="15" fill="#5a626d">Wendezeit je Umlauf: was vorhanden ist, was Tempo 30 davon braucht, was mindestens bleiben muss.</text>
<text x="40" y="101" font-size="13" fill="#5a626d">Fahrzeiten, Wendezeiten und Takt aus dem Fahrplan vom 8. September 2026, alles gemessen statt angenommen.</text>
