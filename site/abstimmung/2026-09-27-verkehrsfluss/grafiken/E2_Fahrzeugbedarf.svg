<text x="660.6" y="452" font-size="11" fill="#5a626d" text-anchor="middle">14</text>
<text x="700.0" y="452" font-size="11" fill="#5a626d" text-anchor="start"> Minuten</text>
<text x="154" y="189" font-size="15" fill="#12161c" text-anchor="end" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="600">Linie 1</text>
<text x="154" y="204" font-size="11.5" fill="#5a626d" text-anchor="end">6 Fahrzeuge, 10-Min-Takt</text>
