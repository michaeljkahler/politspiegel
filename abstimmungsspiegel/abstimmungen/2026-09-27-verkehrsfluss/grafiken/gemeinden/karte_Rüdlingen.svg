<text x="46.0" y="34.0" font-size="23" fill="#141414" text-anchor="start" font-weight="bold" opacity="1.0">Rüdlingen: betroffene Strassen und Umkreise sensibler Nutzungen</text>
<text x="46.0" y="56.0" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" opacity="1.0">Verkehrsorientierte Kantonsstrassen innerorts mit 100 m, 300 m und 500 m Umkreis um Schulen, Kindergärten, Alters-/Pflegeheime und weitere Sozialeinrichtungen.</text>
