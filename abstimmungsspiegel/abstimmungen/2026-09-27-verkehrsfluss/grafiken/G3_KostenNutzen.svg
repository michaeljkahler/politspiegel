<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="955" viewBox="0 0 1120 955" font-family="Arial, 'Helvetica Neue', system-ui, sans-serif">
<rect x="0.0" y="0.0" width="1120.0" height="955.0" fill="#f7f8fa" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<rect x="0.0" y="0.0" width="1120.0" height="8.0" fill="#3c4652" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<text x="70.0" y="58.0" font-size="30" fill="#12161c" text-anchor="start" font-weight="bold">Kosten und Nutzen einer Temporeduktion</text>
<text x="70.0" y="90.0" font-size="16" fill="#5a626d" text-anchor="start" font-weight="normal">Illustratives Szenario: Tempo 30 statt 50 auf allen betroffenen Kantonsstrassen innerorts. Jahreswerte in Franken, Kanton Schaffhausen.</text>
<rect x="70.0" y="118.0" width="980.0" height="360.0" fill="#ffffff" rx="14" stroke="#e2e6eb" stroke-width="1.5" opacity="1"/>
<text x="94.0" y="152.0" font-size="18" fill="#12161c" text-anchor="start" font-weight="bold">Monetarisierte Jahresbilanz (Gesamtnetz-Szenario)</text>
<line x1="320.0" y1="188.0" x2="320.0" y2="418.0" stroke="#e2e6eb" stroke-width="1" stroke-dasharray="none"/>
<text x="320.0" y="438.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">0</text>
<line x1="415.7" y1="188.0" x2="415.7" y2="418.0" stroke="#e2e6eb" stroke-width="1" stroke-dasharray="none"/>
<text x="415.7" y="438.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">5</text>
<line x1="511.4" y1="188.0" x2="511.4" y2="418.0" stroke="#e2e6eb" stroke-width="1" stroke-dasharray="none"/>
<text x="511.4" y="438.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">10</text>
<line x1="607.1" y1="188.0" x2="607.1" y2="418.0" stroke="#e2e6eb" stroke-width="1" stroke-dasharray="none"/>
<text x="607.1" y="438.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">15</text>
<line x1="702.9" y1="188.0" x2="702.9" y2="418.0" stroke="#e2e6eb" stroke-width="1" stroke-dasharray="none"/>
<text x="702.9" y="438.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">20</text>
<line x1="798.6" y1="188.0" x2="798.6" y2="418.0" stroke="#e2e6eb" stroke-width="1" stroke-dasharray="none"/>
<text x="798.6" y="438.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">25</text>
<line x1="894.3" y1="188.0" x2="894.3" y2="418.0" stroke="#e2e6eb" stroke-width="1" stroke-dasharray="none"/>
<text x="894.3" y="438.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">30</text>
<line x1="990.0" y1="188.0" x2="990.0" y2="418.0" stroke="#e2e6eb" stroke-width="1" stroke-dasharray="none"/>
<text x="990.0" y="438.0" font-size="11.5" fill="#8b93a1" text-anchor="middle" font-weight="normal">35</text>
<text x="655.0" y="456.0" font-size="12" fill="#8b93a1" text-anchor="middle" font-weight="normal">Mio. CHF pro Jahr</text>
<text x="94.0" y="220.0" font-size="14" fill="#12161c" text-anchor="start" font-weight="bold">Kosten</text>
<text x="94.0" y="240.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">Zeitverlust</text>
<rect x="320.0" y="202.0" width="595.9" height="52.0" fill="#4a5563" rx="4" stroke="none" stroke-width="1" opacity="1"/>
<text x="925.9" y="233.0" font-size="15" fill="#4a5563" text-anchor="start" font-weight="bold">31 Mio.</text>
<line x1="915.9" y1="196.0" x2="915.9" y2="260.0" stroke="#4a5563" stroke-width="1" stroke-dasharray="3 3"/>
<text x="990.0" y="192.0" font-size="11.5" fill="#8b93a1" text-anchor="end" font-weight="normal">theoretisch bis 75 Mio.</text>
<text x="94.0" y="340.0" font-size="14" fill="#12161c" text-anchor="start" font-weight="bold">Nutzen</text>
<text x="94.0" y="360.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">Unfälle + Aufwertung</text>
<rect x="320.0" y="322.0" width="42.3" height="52.0" fill="#a9b1be" rx="4" stroke="none" stroke-width="1" opacity="1"/>
<rect x="364.3" y="322.0" width="14.1" height="52.0" fill="#3c4652" rx="4" stroke="none" stroke-width="1" opacity="1"/>
<text x="386.4" y="353.0" font-size="15" fill="#12161c" text-anchor="start" font-weight="bold">2,9 Mio.</text>
<rect x="94.0" y="409.0" width="12.0" height="12.0" fill="#a9b1be" rx="2" stroke="none" stroke-width="1" opacity="1"/>
<text x="112.0" y="419.0" font-size="11.5" fill="#5a626d" text-anchor="start" font-weight="normal">Weniger Unfallkosten (2,2 Mio.)</text>
<rect x="324.0" y="409.0" width="12.0" height="12.0" fill="#3c4652" rx="2" stroke="none" stroke-width="1" opacity="1"/>
<text x="342.0" y="419.0" font-size="11.5" fill="#5a626d" text-anchor="start" font-weight="normal">Aufwertung Liegenschaften / Lärm (0,7 Mio.)</text>
<text x="70.0" y="510.0" font-size="20" fill="#12161c" text-anchor="start" font-weight="bold">Drei Dinge zur Einordnung</text>
<rect x="70.0" y="530.0" width="310.7" height="230.0" fill="#ffffff" rx="12" stroke="#e2e6eb" stroke-width="1.3" opacity="1"/>
<rect x="70.0" y="530.0" width="310.7" height="6.0" fill="#3c4652" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="104.0" cy="574.0" r="16" fill="#3c4652"/>
<text x="104.0" y="580.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="92.0" y="622.0" font-size="15.5" fill="#12161c" text-anchor="start" font-weight="bold">Pro Fahrt winzig, in Summe gross</text>
<text x="92.0" y="646.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">Der Zeitverlust beträgt rund 2 Sekunden</text>
<text x="92.0" y="664.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">pro 100 Meter. Die grosse Summe entsteht</text>
<text x="92.0" y="682.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">erst durch alle Fahrten, multipliziert</text>
<text x="92.0" y="700.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">mit 365 Tagen und einem hohen Zeitwert.</text>
<rect x="404.7" y="530.0" width="310.7" height="230.0" fill="#ffffff" rx="12" stroke="#e2e6eb" stroke-width="1.3" opacity="1"/>
<rect x="404.7" y="530.0" width="310.7" height="6.0" fill="#3c4652" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="438.7" cy="574.0" r="16" fill="#3c4652"/>
<text x="438.7" y="580.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="426.7" y="622.0" font-size="15.5" fill="#12161c" text-anchor="start" font-weight="bold">Gezielt wirkt am besten</text>
<text x="426.7" y="646.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">Unfälle und Lärm häufen sich in wenigen</text>
<text x="426.7" y="664.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">Gemeinden. Gezielte Tempo-30-Abschnitte</text>
<text x="426.7" y="682.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">an Problemstellen kosten wenig Zeit,</text>
<text x="426.7" y="700.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">bringen dort aber den grössten Nutzen.</text>
<text x="426.7" y="718.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">Flächendeckend ist teuer.</text>
<rect x="739.3" y="530.0" width="310.7" height="230.0" fill="#ffffff" rx="12" stroke="#e2e6eb" stroke-width="1.3" opacity="1"/>
<rect x="739.3" y="530.0" width="310.7" height="6.0" fill="#3c4652" rx="0" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="773.3" cy="574.0" r="16" fill="#3c4652"/>
<text x="773.3" y="580.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="761.3" y="622.0" font-size="15.5" fill="#12161c" text-anchor="start" font-weight="bold">Nicht in Franken messbar</text>
<text x="761.3" y="646.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">Wohn- und Aufenthaltsqualität, Ortsbild</text>
<text x="761.3" y="664.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">und subjektive Sicherheit fehlen als</text>
<text x="761.3" y="682.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">Nutzen; die Bus-Fahrplanstabilität auf</text>
<text x="761.3" y="700.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">langen Abschnitten fehlt als</text>
<text x="761.3" y="718.0" font-size="12.5" fill="#5a626d" text-anchor="start" font-weight="normal">Gegenposten.</text>
<rect x="70.0" y="784.0" width="980.0" height="86.0" fill="#ffffff" rx="12" stroke="#e2e6eb" stroke-width="1.3" opacity="1"/>
<text x="90.0" y="814.0" font-size="14" fill="#12161c" text-anchor="start" font-weight="bold">Datenbasis</text>
<text x="90.0" y="846.0" font-size="22" fill="#3c4652" text-anchor="start" font-weight="bold">1 189</text>
<text x="90.0" y="864.0" font-size="10.8" fill="#5a626d" text-anchor="start" font-weight="normal">Unfälle mit Personenschaden (2011–2025)</text>
<text x="325.0" y="846.0" font-size="22" fill="#3c4652" text-anchor="start" font-weight="bold">40 %</text>
<text x="325.0" y="864.0" font-size="10.8" fill="#5a626d" text-anchor="start" font-weight="normal">davon mit Fussgänger oder Velo</text>
<text x="560.0" y="846.0" font-size="22" fill="#3c4652" text-anchor="start" font-weight="bold">1 816</text>
<text x="560.0" y="864.0" font-size="10.8" fill="#5a626d" text-anchor="start" font-weight="normal">Fassaden über dem Lärm-Grenzwert</text>
<text x="795.0" y="846.0" font-size="22" fill="#3c4652" text-anchor="start" font-weight="bold">4 599</text>
<text x="795.0" y="864.0" font-size="10.8" fill="#5a626d" text-anchor="start" font-weight="normal">mittlerer DTV auf Kantonsstrassen innerorts</text>
<text x="70.0" y="915.0" font-size="11" fill="#8b93a1" text-anchor="start" font-weight="normal">Annahmen (editierbar in der Arbeitsmappe): Zeitwert 42.50 CHF/Fz-h; +20 s/km; Unfallreduktion 20 %; NSDI 0,5 %/dB; 3 dB; Wert 900 000 CHF/Fassade; Kapitalisierung 3 %.</text>
<text x="70.0" y="933.0" font-size="11" fill="#8b93a1" text-anchor="start" font-weight="normal">Quellen: geo.sh.ch (DTV, Lärmkataster), ASTRA-Unfalldaten, ARE/VSS, bfu, BAFU.</text>
</svg>