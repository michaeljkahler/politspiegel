<text x="44.0" y="78.0" font-size="14" fill="#5a626d" text-anchor="start" font-weight="normal">Monetarisierter Nutzen (Unfall- und Lärmkostenersparnis) geteilt durch die Zeitkosten, aggregiert über die verkehrsorientierten Abschnitte je Gemeinde.</text>
<text x="44.0" y="99.0" font-size="12.5" fill="#8b93a1" text-anchor="start" font-weight="normal">Gemeinden mit mindestens zwei verkehrsorientierten Abschnitten. Zonen = Terzile der Verteilung über alle Abschnitte. Illustratives Szenario.</text>
