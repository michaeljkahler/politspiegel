<text x="44.0" y="50.0" font-size="26" fill="#12161c" text-anchor="start" font-weight="bold">Wo lohnen sich gezielte Massnahmen?</text>
<text x="44.0" y="77.0" font-size="13.5" fill="#5a626d" text-anchor="start" font-weight="normal">Alle verkehrsorientierten Kantonsstrassen-Abschnitte innerorts. Waagrecht die Verkehrsmenge (Treiber der Zeitkosten), senkrecht die Unfallrate.</text>
<text x="44.0" y="98.0" font-size="12.5" fill="#8b93a1" text-anchor="start" font-weight="normal">Kreisgrösse = lärmbelastete Fassaden. Farbe = Eignung aus Unfalldichte und Lärm. Waagrechte Zonen je 1 Unfall pro km und Jahr.</text>
