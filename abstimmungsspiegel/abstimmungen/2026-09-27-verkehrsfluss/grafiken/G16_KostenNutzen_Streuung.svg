<text x="44.0" y="77.0" font-size="13.5" fill="#5a626d" text-anchor="start" font-weight="normal">Alle verkehrsorientierten Kantonsstrassen-Abschnitte innerorts (ab 2000 Fz-km/Tag). Waagrecht die Zeitkosten, senkrecht der monetarisierte Nutzen, je Franken pro Jahr.</text>
<text x="44.0" y="98.0" font-size="12.5" fill="#8b93a1" text-anchor="start" font-weight="normal">Die Zonen entsprechen den Terzilen der Verhältnis-Verteilung über alle Abschnitte. Oben links ist der Nutzen je Franken am höchsten. Illustratives Szenario.</text>
