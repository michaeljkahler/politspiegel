<text x="90.0" y="456.0" font-size="14" fill="#1f2833" text-anchor="start" font-weight="bold">Kernaussage:</text>
<text x="90.0" y="477.0" font-size="13" fill="#5a626d" text-anchor="start" font-weight="normal">Rund 83 % der betroffenen Kantonsstrassen-Kilometer sind höchstens 6 m breit. Zwei Lastwagen können sich dort bei Tempo 50 nicht sicher kreuzen.</text>
<text x="70.0" y="544.0" font-size="11" fill="#8b93a1" text-anchor="start" font-weight="normal">Quelle: swissTLM3D (geo.admin.ch), Kantonsstrassen innerorts.</text>
